<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Әкімші бөлімі</title>
<style>
  :root { --bg: #F7FAFC; --navy: #173B57; --green: #258477; --mint: #EAF5F1; --text: #28343D; --muted: #5B6B77; --line: #DCE5EB; --red: #B42318; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 "Noto Sans", system-ui, sans-serif; background: var(--bg); color: var(--text); }
  .wrap { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  h1 { margin: 0; font-size: 1.5rem; color: var(--navy); }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button, select { font: inherit; border-radius: 10px; border: 1.5px solid var(--line); background: #fff; color: var(--navy); padding: 8px 14px; cursor: pointer; min-height: 40px; }
  button.primary { background: var(--green); border-color: var(--green); color: #fff; font-weight: 600; }
  button.danger { color: var(--red); border-color: #F4C7C3; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; display: grid; gap: 8px; }
  .card.hidden { opacity: .6; background: #F2F4F6; }
  .list { display: grid; gap: 14px; }
  .top { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; }
  .top b { color: var(--navy); }
  .stars { color: #F5B301; letter-spacing: 1px; }
  .muted { color: var(--muted); font-size: .875rem; }
  .text { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
  .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  .badge { font-size: .75rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: #FEF0C7; color: #93370D; }
  form.login { max-width: 360px; margin: 12vh auto 0; display: grid; gap: 14px; }
  input { font: inherit; padding: 12px 14px; border-radius: 10px; border: 1.5px solid var(--line); min-height: 48px; }
  .err { color: var(--red); font-weight: 600; font-size: .875rem; min-height: 1.2em; }
  .stat { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 16px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tabs button.on { background: var(--navy); border-color: var(--navy); color: #fff; font-weight: 600; }
  .new { font-size: .75rem; font-weight: 700; padding: 1px 8px; border-radius: 99px; background: #D92D20; color: #fff; margin-left: 6px; }
  .card.unread { border-color: var(--green); box-shadow: 0 0 0 2px var(--mint); }
  .topic { font-size: .75rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--mint); color: var(--green); }
  .sec { margin: 28px 0 10px; color: var(--navy); font-size: 1.2rem; }
  .grp { margin: 18px 0 6px; color: var(--green); font-size: 1rem; }
  .rows { display: grid; gap: 8px; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; align-items: center; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .row.off { opacity: .55; }
  .row .ctl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .row input[type=number] { width: 110px; min-height: 40px; padding: 6px 10px; }
  .row select { min-height: 40px; padding: 6px 10px; }
  .row .nm { overflow-wrap: anywhere; }
  .row .nm small { display: block; color: var(--muted); }
  .chk { display: inline-flex; gap: 6px; align-items: center; font-size: .875rem; color: var(--muted); }
  .chk input { width: 18px; height: 18px; min-height: 0; accent-color: var(--green); }
  .bar { position: sticky; bottom: 0; background: var(--bg); padding: 12px 0; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; border-top: 1px solid var(--line); margin-top: 20px; }
  .ok { color: var(--green); font-weight: 600; }
  @media (max-width: 600px) { .row { grid-template-columns: 1fr; } .row .ctl { justify-content: flex-start; } .row input[type=number] { width: 96px; } }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const L = {
  kk: { title: 'Пікірлер', login: 'Кіру', pass: 'Құпия сөз', logout: 'Шығу', hide: 'Жасыру', show: 'Көрсету', del: 'Өшіру', confirm: 'Бұл пікірді біржола өшіру керек пе?', hiddenB: 'Жасырылған', empty: 'Пікір жоқ', all: 'Барлығы', visible: 'Сайтта', hiddenN: 'Жасырылған', avg: 'Орташа баға', site: 'Сайтқа өту', filterAll: 'Барлығы', filterHidden: 'Тек жасырылған', err: 'Қате. Қайталап көріңіз.', tabR: 'Пікірлер', tabS: 'Ұсыныстар', emptyS: 'Ұсыныс жоқ', read: 'Оқылды', unread: 'Оқылмаған деп белгілеу', newB: 'Жаңа', confirmS: 'Бұл ұсынысты біржола өшіру керек пе?', phone: 'Телефон', reply: 'Жауап күтеді', anon: 'Аты жазылмаған', unreadN: 'Оқылмаған', tabP: 'Бағалар', priceList: 'Прайс-лист', shop: 'Дүкен', min: 'Бастап', max: 'Дейін', hideRow: 'Жасыру', save: 'Сақтау', saved: 'Сақталды. Сайтта бағалар ауысты.', unsaved: 'Сақталмаған өзгеріс бар', priceHint: 'Бір баға болса, екі жолға да сол санды жазыңыз. Бос қалса, «Бағасы нақтыланады» деп тұрады.', price: 'Бағасы, ₸', stock: 'Қоймада', stockU: 'Белгісіз', stockY: 'Бар', stockN: 'Жоқ', search: 'Өнімді іздеу', badNum: 'Бағаны тек санмен жазыңыз', leave: 'Сақталмаған өзгерістер жоғалады. Шыға берейік пе?' },
  ru: { title: 'Отзывы', login: 'Войти', pass: 'Пароль', logout: 'Выйти', hide: 'Скрыть', show: 'Показать', del: 'Удалить', confirm: 'Удалить этот отзыв навсегда?', hiddenB: 'Скрыт', empty: 'Отзывов нет', all: 'Всего', visible: 'На сайте', hiddenN: 'Скрыто', avg: 'Средняя оценка', site: 'На сайт', filterAll: 'Все', filterHidden: 'Только скрытые', err: 'Ошибка. Попробуйте ещё раз.', tabR: 'Отзывы', tabS: 'Предложения', emptyS: 'Предложений нет', read: 'Прочитано', unread: 'Отметить непрочитанным', newB: 'Новое', confirmS: 'Удалить это предложение навсегда?', phone: 'Телефон', reply: 'Ждёт ответа', anon: 'Без имени', unreadN: 'Непрочитанных', tabP: 'Цены', priceList: 'Прайс-лист', shop: 'Магазин', min: 'От', max: 'До', hideRow: 'Скрыть', save: 'Сохранить', saved: 'Сохранено. Цены на сайте обновлены.', unsaved: 'Есть несохранённые изменения', priceHint: 'Если цена одна, впишите одно и то же число в оба поля. Пустое поле: на сайте будет «Цена уточняется».', price: 'Цена, ₸', stock: 'Наличие', stockU: 'Неизвестно', stockY: 'Есть', stockN: 'Нет', search: 'Поиск товара', badNum: 'Цену пишите только цифрами', leave: 'Несохранённые изменения пропадут. Выйти?' },
};
let lang = localStorage.getItem('pd_admin_lang') || 'kk';
let t = L[lang];
let items = [], sugs = [], filter = 'all', tab = 'r';
let cat = null, content = { prices: {}, products: {} }, dirty = false, q = '';
const app = document.getElementById('app');
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const api = (p, o = {}) => fetch(p, { ...o, headers: { 'content-type': 'application/json' }, credentials: 'same-origin' });
const fmt = (d) => new Date(d).toLocaleString(lang === 'kk' ? 'kk-KZ' : 'ru-RU', { dateStyle: 'medium', timeStyle: 'short' });
const langSel = () => `<select id="lang">${Object.keys(L).map((k) => `<option value="${k}" ${k === lang ? 'selected' : ''}>${k === 'kk' ? 'Қазақша' : 'Русский'}</option>`).join('')}</select>`;
const bindLang = () => document.getElementById('lang').onchange = (e) => { lang = e.target.value; t = L[lang]; try { localStorage.setItem('pd_admin_lang', lang); } catch {} load(); };

function loginView(msg = '') {
  document.documentElement.lang = lang;
  app.innerHTML = `<form class="login card"><h1>${t.title}</h1>${langSel()}<input type="password" name="p" placeholder="${t.pass}" autocomplete="current-password" required autofocus><button class="primary">${t.login}</button><div class="err">${esc(msg)}</div></form>`;
  bindLang();
  app.querySelector('form').onsubmit = async (e) => {
    e.preventDefault();
    const r = await api('/api/admin/login', { method: 'POST', body: JSON.stringify({ password: e.target.p.value }) });
    if (r.ok) return load();
    const d = await r.json().catch(() => ({}));
    loginView(d.error || t.err);
  };
}

function tabs() {
  const n = sugs.filter((x) => !x.read).length;
  document.title = (n ? `(${n}) ` : '') + `${t.tabR} / ${t.tabS}`;
  return `<div class="tabs"><button data-tab="r" class="${tab === 'r' ? 'on' : ''}">${t.tabR} (${items.length})</button><button data-tab="s" class="${tab === 's' ? 'on' : ''}">${t.tabS} (${sugs.length})${n ? `<span class="new">${n}</span>` : ''}</button><button data-tab="p" class="${tab === 'p' ? 'on' : ''}">${t.tabP}</button></div>`;
}
function bindTabs() { app.querySelectorAll('[data-tab]').forEach((b) => b.onclick = () => { if (dirty && !confirm(t.leave)) return; dirty = false; tab = b.dataset.tab; view(); }); }

function viewS() {
  const n = sugs.filter((x) => !x.read).length;
  app.innerHTML = `<header><h1>${t.tabS}</h1><div class="tools">${langSel()}<a href="/"><button type="button">${t.site}</button></a><button id="out">${t.logout}</button></div></header>${tabs()}
    <div class="stat muted"><span>${t.all}: <b>${sugs.length}</b></span><span>${t.unreadN}: <b>${n}</b></span></div>
    <div class="list">${sugs.length ? sugs.map((r) => `<article class="card ${r.read ? '' : 'unread'}" data-id="${r.id}">
      <div class="top">${r.topic ? `<span class="topic">${esc(r.topic)}</span>` : ''}<b>${r.name ? esc(r.name) : `<span class="muted">${t.anon}</span>`}</b><span class="muted">${fmt(r.createdAt)}</span>${r.read ? '' : `<span class="badge">${t.newB}</span>`}</div>
      <p class="text">${esc(r.text)}</p>
      ${r.phone || r.reply ? `<div class="muted">${r.phone ? `${t.phone}: <a href="https://wa.me/${esc(r.phone.replace(/\D/g, ''))}" target="_blank" rel="noopener">${esc(r.phone)}</a>` : ''} ${r.reply ? `· ${t.reply}` : ''}</div>` : ''}
      <div class="acts"><button data-act="read">${r.read ? t.unread : t.read}</button><button class="danger" data-act="del">${t.del}</button></div></article>`).join('') : `<p class="muted">${t.emptyS}</p>`}</div>`;
  bindLang(); bindTabs();
  document.getElementById('out').onclick = async () => { await api('/api/admin/logout', { method: 'POST' }); loginView(); };
  app.querySelectorAll('[data-act]').forEach((b) => b.onclick = async () => {
    const id = b.closest('[data-id]').dataset.id;
    const r = sugs.find((x) => x.id === id);
    let res;
    if (b.dataset.act === 'del') { if (!confirm(t.confirmS)) return; res = await api(`/api/admin/suggestions/${id}`, { method: 'DELETE' }); }
    else res = await api(`/api/admin/suggestions/${id}`, { method: 'PATCH', body: JSON.stringify({ read: !r.read }) });
    if (res.status === 401) return loginView();
    if (!res.ok) return alert(t.err);
    load();
  });
}

// Бағалар: бастапқы мән сайттың өзінен (/catalog.json), өзгерткені серверде (/api/content)
function viewP(msg = '') {
  if (!cat) { tab = 'r'; return view(); }
  const nm = (o) => o[lang] || o.ru;
  const pv = (r) => content.prices[r.id] || r;
  const vv = (p, v) => content.products[`${p.slug}|${v.size}`] || v;
  const prod = cat.products.filter((p) => !q || (p.name + ' ' + p.variants.map((v) => v.art).join(' ')).toLowerCase().includes(q.toLowerCase()));
  app.innerHTML = `<header><h1>${t.tabP}</h1><div class="tools">${langSel()}<a href="/"><button type="button">${t.site}</button></a><button id="out">${t.logout}</button></div></header>${tabs()}
    <p class="muted">${t.priceHint}</p>
    <h2 class="sec">${t.priceList}</h2>
    ${cat.prices.map((g) => `<h3 class="grp">${esc(nm(g.title))}</h3><div class="rows">${g.rows.map((r) => { const c = pv(r); return `<div class="row ${c.hidden ? 'off' : ''}" data-pr="${esc(r.id)}">
      <div class="nm">${esc(nm(r.name))}</div>
      <div class="ctl"><input type="number" min="0" step="500" inputmode="numeric" data-k="min" value="${c.min}" aria-label="${t.min}"> – <input type="number" min="0" step="500" inputmode="numeric" data-k="max" value="${c.max}" aria-label="${t.max}">
      <label class="chk"><input type="checkbox" data-k="hidden" ${c.hidden ? 'checked' : ''}>${t.hideRow}</label></div></div>`; }).join('')}</div>`).join('')}
    <h2 class="sec">${t.shop}</h2>
    <input id="q" type="search" placeholder="${t.search}" value="${esc(q)}" style="width:100%;max-width:420px;margin-bottom:12px">
    <div class="rows">${prod.map((p) => p.variants.map((v) => { const c = vv(p, v); return `<div class="row" data-pp="${esc(p.slug)}|${esc(v.size)}">
      <div class="nm">${esc(p.name)}<small>${esc(v.size)} · арт. ${esc(v.art)}</small></div>
      <div class="ctl"><input type="number" min="0" step="100" inputmode="numeric" data-k="price" value="${c.price ?? ''}" placeholder="${t.price}" aria-label="${t.price}">
      <select data-k="stock" aria-label="${t.stock}"><option value="">${t.stock}: ${t.stockU}</option><option value="1" ${c.inStock === true ? 'selected' : ''}>${t.stockY}</option><option value="0" ${c.inStock === false ? 'selected' : ''}>${t.stockN}</option></select></div></div>`; }).join('')).join('')}</div>
    <div class="bar"><button class="primary" id="save">${t.save}</button><span id="msg" class="${msg ? 'ok' : 'muted'}">${esc(msg)}</span></div>`;
  bindLang(); bindTabs();
  document.getElementById('out').onclick = async () => { await api('/api/admin/logout', { method: 'POST' }); loginView(); };
  const mark = () => { dirty = true; const m = document.getElementById('msg'); m.className = 'err'; m.textContent = t.unsaved; };
  app.querySelectorAll('.row input, .row select').forEach((el) => { el.oninput = mark; el.onchange = (e) => { mark(); if (el.dataset.k === 'hidden') el.closest('.row').classList.toggle('off', el.checked); }; });
  // Іздегенде енгізілген мәндер жоғалмасын: алдымен жадқа жинаймыз
  document.getElementById('q').oninput = (e) => { const c = collect(); if (!c) return; content = c; q = e.target.value; viewP(); const i = document.getElementById('q'); i.focus(); i.setSelectionRange(q.length, q.length); if (dirty) mark(); };
  document.getElementById('save').onclick = async () => {
    const c = collect(); if (!c) return;
    const res = await api('/api/admin/content', { method: 'PUT', body: JSON.stringify(c) });
    if (res.status === 401) return loginView();
    if (!res.ok) return alert(t.err);
    content = await res.json(); dirty = false; viewP(t.saved);
  };
}
// Тек бастапқы мәннен өзгеше жолдар сақталады
function collect() {
  const out = { prices: { ...content.prices }, products: { ...content.products } };
  const int = (el) => el.value.trim() === '' ? null : /^\d+$/.test(el.value.trim()) ? Number(el.value) : NaN;
  const rows = Object.fromEntries(cat.prices.flatMap((g) => g.rows.map((r) => [r.id, r])));
  for (const el of app.querySelectorAll('[data-pr]')) {
    const r = rows[el.dataset.pr];
    const min = int(el.querySelector('[data-k=min]')), max = int(el.querySelector('[data-k=max]'));
    const hidden = el.querySelector('[data-k=hidden]').checked;
    if (Number.isNaN(min) || Number.isNaN(max) || min === null || max === null) { alert(t.badNum); el.querySelector('input').focus(); return null; }
    const lo = Math.min(min, max), hi = Math.max(min, max);
    if (lo === r.min && hi === r.max && !hidden) delete out.prices[r.id]; else out.prices[r.id] = { min: lo, max: hi, ...(hidden ? { hidden: true } : {}) };
  }
  const vars = Object.fromEntries(cat.products.flatMap((p) => p.variants.map((v) => [`${p.slug}|${v.size}`, v])));
  for (const el of app.querySelectorAll('[data-pp]')) {
    const v = vars[el.dataset.pp];
    const price = int(el.querySelector('[data-k=price]'));
    if (Number.isNaN(price)) { alert(t.badNum); el.querySelector('input').focus(); return null; }
    const st = el.querySelector('[data-k=stock]').value;
    const inStock = st === '' ? null : st === '1';
    const p = price || null;
    if (p === v.price && inStock === v.inStock) delete out.products[el.dataset.pp]; else out.products[el.dataset.pp] = { price: p, inStock };
  }
  return out;
}
addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

function view() {
  document.documentElement.lang = lang;
  if (tab === 's') return viewS();
  if (tab === 'p') return viewP();
  const vis = items.filter((r) => !r.hidden);
  const avg = vis.length ? (vis.reduce((s, r) => s + r.rating, 0) / vis.length).toFixed(1) : '–';
  const shown = filter === 'hidden' ? items.filter((r) => r.hidden) : items;
  app.innerHTML = `<header><h1>${t.title}</h1><div class="tools">${langSel()}
    <select id="flt"><option value="all">${t.filterAll}</option><option value="hidden" ${filter === 'hidden' ? 'selected' : ''}>${t.filterHidden}</option></select>
    <a href="/"><button type="button">${t.site}</button></a><button id="out">${t.logout}</button></div></header>${tabs()}
    <div class="stat muted"><span>${t.all}: <b>${items.length}</b></span><span>${t.visible}: <b>${vis.length}</b></span><span>${t.hiddenN}: <b>${items.length - vis.length}</b></span><span>${t.avg}: <b>${avg}</b></span></div>
    <div class="list">${shown.length ? shown.map((r) => `<article class="card ${r.hidden ? 'hidden' : ''}" data-id="${r.id}">
      <div class="top"><b>${esc(r.name)}</b><span class="stars">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</span><span class="muted">${fmt(r.createdAt)}</span>${r.hidden ? `<span class="badge">${t.hiddenB}</span>` : ''}</div>
      <p class="text">${esc(r.text)}</p>
      <div class="acts"><button data-act="toggle">${r.hidden ? t.show : t.hide}</button><button class="danger" data-act="del">${t.del}</button></div></article>`).join('') : `<p class="muted">${t.empty}</p>`}</div>`;
  bindLang(); bindTabs();
  document.getElementById('flt').onchange = (e) => { filter = e.target.value; view(); };
  document.getElementById('out').onclick = async () => { await api('/api/admin/logout', { method: 'POST' }); loginView(); };
  app.querySelectorAll('[data-act]').forEach((b) => b.onclick = async () => {
    const id = b.closest('[data-id]').dataset.id;
    const r = items.find((x) => x.id === id);
    let res;
    if (b.dataset.act === 'del') { if (!confirm(t.confirm)) return; res = await api(`/api/admin/reviews/${id}`, { method: 'DELETE' }); }
    else res = await api(`/api/admin/reviews/${id}`, { method: 'PATCH', body: JSON.stringify({ hidden: !r.hidden }) });
    if (res.status === 401) return loginView();
    if (!res.ok) return alert(t.err);
    load();
  });
}

let timer;
async function load(quiet) {
  const [r, s] = await Promise.all([api('/api/admin/reviews'), api('/api/admin/suggestions')]);
  if (r.status === 401) { clearInterval(timer); return loginView(); }
  if (!r.ok || !s.ok) return quiet ? null : loginView(t.err);
  items = (await r.json()).reviews;
  sugs = (await s.json()).suggestions;
  if (!cat) {
    const [c, k] = await Promise.all([fetch('/catalog.json'), fetch('/api/content')]);
    if (c.ok && k.ok) { cat = await c.json(); content = await k.json(); }
  }
  if (quiet && tab === 'p') return; // бағаларды енгізіп жатқанда бетті қайта салмаймыз
  if (!cat && tab === 'p') tab = 'r';
  view();
  clearInterval(timer);
  timer = setInterval(() => { if (!document.querySelector('form.login')) load(true); }, 60000); // әр минут сайын жаңалау
}
load();
</script>
</body>
</html>
