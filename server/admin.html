<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Әкімші бөлімі</title>
<style>
  :root { --bg: #F4F7FA; --navy: #173B57; --navy2: #0F2C42; --green: #258477; --mint: #EAF5F1; --text: #28343D; --muted: #5F6F7B; --line: #DCE5EB; --red: #B42318; --amber: #B54708; --r: 14px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font: 15px/1.5 "Noto Sans", system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  a { color: var(--green); }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 8px 14px; border-radius: 10px; border: 1.5px solid var(--line); background: #fff; color: var(--navy); font-weight: 600; text-decoration: none; white-space: nowrap; }
  .btn:hover { border-color: var(--green); }
  .btn.primary { background: var(--green); border-color: var(--green); color: #fff; }
  .btn.danger { color: var(--red); border-color: #F4C7C3; }
  .btn.sm { min-height: 34px; padding: 5px 10px; font-size: .875rem; border-radius: 8px; }
  .btn.ghost { border-color: transparent; background: transparent; }
  .btn:disabled { opacity: .5; cursor: default; }
  input, select, textarea { border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 12px; background: #fff; min-height: 42px; width: 100%; }
  textarea { min-height: 70px; resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: 2px solid color-mix(in srgb, var(--green) 35%, transparent); border-color: var(--green); }
  label.f { display: grid; gap: 4px; font-size: .875rem; color: var(--muted); font-weight: 600; }
  .grid2 { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .grid3 { display: grid; gap: 10px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  @media (max-width: 700px) { .grid3 { grid-template-columns: 1fr; } }
  .muted { color: var(--muted); }
  .small { font-size: .85rem; }
  .err { color: var(--red); font-weight: 600; font-size: .875rem; }

  /* Каркас */
  .app { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: 100vh; }
  .side { background: var(--navy); color: #fff; padding: 20px 14px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; overflow: auto; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.05rem; padding: 4px 10px 18px; }
  .brand i { width: 34px; height: 34px; border-radius: 10px; background: #7ED43D; color: var(--navy2); display: grid; place-items: center; font-style: normal; font-weight: 800; }
  .brand small { display: block; font-weight: 500; opacity: .7; font-size: .75rem; }
  .nav { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; color: #DCE7EF; text-decoration: none; border: 0; background: none; width: 100%; text-align: left; font-weight: 500; }
  .nav:hover { background: rgb(255 255 255 / .07); color: #fff; }
  .nav.on { background: #fff; color: var(--navy); font-weight: 700; }
  .nav svg { width: 20px; height: 20px; flex: none; }
  .nav .cnt { margin-left: auto; background: #D92D20; color: #fff; font-size: .72rem; font-weight: 700; padding: 1px 7px; border-radius: 99px; }
  .side .sep { height: 1px; background: rgb(255 255 255 / .12); margin: 10px 4px; }
  .side .foot { margin-top: auto; display: grid; gap: 8px; padding-top: 14px; }
  .side select { background: transparent; color: #fff; border-color: rgb(255 255 255 / .25); }
  .side select option { color: var(--text); }
  .main { padding: 24px 28px 90px; min-width: 0; }
  .top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .top h1 { margin: 0; font-size: 1.5rem; color: var(--navy); flex: 1; min-width: 0; }
  .burger { display: none; }
  .burger svg { width: 22px; height: 22px; }
  .lsw { display: inline-flex; border: 1.5px solid var(--line); border-radius: 99px; overflow: hidden; background: #fff; }
  .lsw button { border: 0; background: none; padding: 5px 11px; font-size: .8rem; font-weight: 700; color: var(--muted); }
  .lsw button.on { background: var(--navy); color: #fff; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; font-weight: 600; padding: 4px 10px; border-radius: 99px; background: var(--mint); color: var(--green); }
  .pill.busy { background: #FEF0C7; color: var(--amber); }
  .pill.bad { background: #FEE4E2; color: var(--red); }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .pill.busy .dot { animation: pulse 1s infinite alternate; }
  @keyframes pulse { to { opacity: .3; } }
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    .side { position: fixed; inset: 0 auto 0 0; width: 270px; z-index: 50; transform: translateX(-100%); transition: transform .2s ease; }
    .app.menu .side { transform: none; box-shadow: 0 0 0 100vmax rgb(0 0 0 / .35); }
    .burger { display: inline-flex; }
    .main { padding: 16px 14px 90px; }
    .top h1 { font-size: 1.25rem; }
  }

  /* Карточкалар */
  .card { background: #fff; border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; }
  .list { display: grid; gap: 12px; }
  .tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); margin-bottom: 22px; }
  .tile { background: #fff; border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 4px; text-decoration: none; color: inherit; text-align: left; }
  .tile:hover { border-color: var(--green); }
  .tile b { font-size: 1.7rem; color: var(--navy); line-height: 1.1; }
  .tile span { color: var(--muted); font-size: .9rem; }
  .tile.hot b { color: #D92D20; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row.end { justify-content: flex-end; }
  .sp { flex: 1; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .chip { border: 1.5px solid var(--line); background: #fff; border-radius: 99px; padding: 5px 12px; font-size: .85rem; font-weight: 600; color: var(--navy); }
  .chip.on { background: var(--navy); border-color: var(--navy); color: #fff; }
  .tag { font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--mint); color: var(--green); }
  .tag.warn { background: #FEF0C7; color: #93370D; }
  .tag.red { background: #FEE4E2; color: var(--red); }
  .stars { color: #F5B301; letter-spacing: 1px; }
  .txt { white-space: pre-wrap; overflow-wrap: anywhere; margin: 6px 0; }
  .reply { border-left: 3px solid var(--green); background: var(--mint); padding: 8px 12px; border-radius: 0 10px 10px 0; margin: 8px 0; }
  .card.dim { opacity: .6; background: #F2F4F6; }
  .card.new { border-color: var(--green); box-shadow: 0 0 0 2px var(--mint); }
  h2.sec { font-size: 1.1rem; color: var(--navy); margin: 26px 0 10px; }
  h2.sec:first-child { margin-top: 0; }
  .empty { text-align: center; padding: 40px 16px; color: var(--muted); }

  /* Медиа торы */
  .media { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
  .mi { background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: grid; text-align: left; padding: 0; position: relative; }
  .mi:hover { border-color: var(--green); }
  .mi .ph { aspect-ratio: 4 / 3; background: var(--mint) center / cover no-repeat; position: relative; }
  .mi .ph .play { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-size: 2rem; text-shadow: 0 1px 6px rgb(0 0 0 / .5); }
  .mi .cap { padding: 8px 10px 10px; font-size: .85rem; line-height: 1.35; display: grid; gap: 4px; }
  .mi .cap b { color: var(--navy); font-weight: 600; overflow-wrap: anywhere; }
  .mi.dim .ph { filter: grayscale(1) opacity(.5); }
  .mi .badge { position: absolute; top: 8px; left: 8px; }
  .add { border: 2px dashed var(--line); border-radius: 12px; display: grid; place-items: center; min-height: 150px; color: var(--green); font-weight: 700; background: #fff; }
  .add:hover { border-color: var(--green); }

  /* Терезе */
  .modal { position: fixed; inset: 0; z-index: 80; background: rgb(15 44 66 / .5); display: grid; place-items: center; padding: 16px; }
  .dlg { background: #fff; border-radius: 18px; width: min(720px, 100%); max-height: calc(100vh - 32px); overflow: auto; padding: 20px; display: grid; gap: 14px; }
  .dlg h3 { margin: 0; color: var(--navy); font-size: 1.15rem; }
  .dlg .pv { border-radius: 12px; overflow: hidden; background: #000; max-height: 340px; display: grid; place-items: center; }
  .dlg .pv img, .dlg .pv video { max-width: 100%; max-height: 340px; display: block; }
  .bar { position: sticky; bottom: 0; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px); padding: 12px 0; margin-top: 18px; border-top: 1px solid var(--line); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; z-index: 5; }
  .prog { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .prog i { display: block; height: 100%; background: var(--green); width: 0; transition: width .2s; }

  /* Бағалар мен мәтіндер жолдары */
  .rows { display: grid; gap: 8px; }
  .pr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; align-items: center; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .pr.off { opacity: .55; }
  .pr .ctl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .pr input[type=number] { width: 110px; min-height: 38px; padding: 6px 10px; }
  .pr select { width: auto; min-height: 38px; padding: 6px 10px; }
  .pr small { display: block; color: var(--muted); }
  .chk { display: inline-flex; gap: 6px; align-items: center; font-size: .875rem; color: var(--muted); }
  .chk input { width: 18px; height: 18px; min-height: 0; accent-color: var(--green); }
  @media (max-width: 600px) { .pr { grid-template-columns: 1fr; } .pr .ctl { justify-content: flex-start; } .pr input[type=number] { width: 96px; } }
  .tx { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 8px; }
  .tx.ch { border-color: var(--green); box-shadow: 0 0 0 2px var(--mint); }
  .tx .k { font-size: .75rem; color: var(--muted); display: flex; gap: 8px; align-items: center; }
  .tx textarea { min-height: 44px; }
  .lg { font-size: .7rem; font-weight: 700; color: var(--green); }

  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--navy2); color: #fff; padding: 10px 16px; border-radius: 12px; z-index: 99; font-weight: 600; box-shadow: 0 6px 24px rgb(0 0 0 / .2); max-width: calc(100vw - 32px); }
  .login { max-width: 380px; margin: 14vh auto 0; display: grid; gap: 14px; padding: 24px; }
  .login h1 { margin: 0; color: var(--navy); }
  @media (max-width: 600px) { .chips { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; } .chip { flex: none; } #bpill .pill { font-size: 0; gap: 0; padding: 8px; } }
</style>

const upload = (blob, name, onProgress) => new Promise((ok, no) => {
  const x = new XMLHttpRequest();
  x.open('PUT', `/api/admin/upload?name=${encodeURIComponent(name)}`);
  x.upload.onprogress = (e) => e.lengthComputable && onProgress?.(e.loaded / e.total);
  x.onload = () => { if (x.status === 201) ok(JSON.parse(x.responseText).url); else if (x.status === 401) { showLogin(); no(new Error('login')); } else no(new Error(x.status === 413 ? t.mBig : t.err)); };
  x.onerror = () => no(new Error(t.err));
  x.send(blob);
});
// Суретті браузерде кішірейтіп, WEBP (болмаса JPG) етеміз: сайт жылдам ашылады
async function shrink(file, max) {
  const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }).catch(() => null);
  if (!bmp) return { blob: file, ext: (file.name.split('.').pop() || 'jpg').toLowerCase(), w: 0, h: 0 };
  const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  let blob = await new Promise((r) => c.toBlob(r, 'image/webp', 0.86));
  let ext = 'webp';
  if (!blob || blob.type !== 'image/webp') { blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.88)); ext = 'jpg'; }
  return { blob, ext, w: bmp.width, h: bmp.height };
}
async function uploadImage(file, sizes = [2000], onProgress) {
  if (!/^image\//.test(file.type)) throw new Error(t.mType);
  const base = (file.name.replace(/\.[^.]+$/, '') || 'photo').slice(0, 30);
  const out = [];
  for (const [i, max] of sizes.entries()) { const s = await shrink(file, max); out.push({ url: await upload(s.blob, `${base}${i ? '-sm' : ''}.${s.ext}`, (p) => onProgress?.((i + p) / sizes.length)), w: s.w, h: s.h }); }
  return out;
}
// Видеоның мұқабасы: 1-секундтағы кадр браузерде суретке айналады
async function videoPoster(file) {
  try {
    const v = document.createElement('video'); v.muted = true; v.playsInline = true; v.preload = 'auto'; v.src = URL.createObjectURL(file);
    await new Promise((ok, no) => { v.onloadeddata = ok; v.onerror = no; setTimeout(no, 15000); });
    v.currentTime = Math.min(1, (v.duration || 2) / 3);
    await new Promise((ok) => { v.onseeked = ok; setTimeout(ok, 4000); });
    const k = Math.min(1, 1280 / Math.max(v.videoWidth, v.videoHeight));
    const c = document.createElement('canvas'); c.width = Math.round(v.videoWidth * k); c.height = Math.round(v.videoHeight * k);
    if (!c.width) return '';
    c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
    let blob = await new Promise((r) => c.toBlob(r, 'image/webp', 0.84)); let ext = 'webp';
    if (!blob || blob.type !== 'image/webp') { blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.86)); ext = 'jpg'; }
    URL.revokeObjectURL(v.src);
    return await upload(blob, `poster.${ext}`);
  } catch { return ''; }
}
async function uploadVideo(file, onProgress) {
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  if (!['mp4', 'webm', 'mov'].includes(ext)) throw new Error(t.mType);
  if (ext === 'mov') alert(t.mMov);
  const poster = await videoPoster(file);
  const src = await upload(file, `video.${ext}`, onProgress);
  return { src, poster };
}
const pickFiles = (accept, multiple = false) => new Promise((ok) => { const i = document.createElement('input'); i.type = 'file'; i.accept = accept; i.multiple = multiple; i.onchange = () => ok([...i.files]); i.click(); });

function modal(html, bind) {
  const m = document.createElement('div'); m.className = 'modal'; m.innerHTML = `<div class="dlg" role="dialog" aria-modal="true">${html}</div>`;
  document.body.append(m); document.documentElement.style.overflow = 'hidden';
  const close = () => { m.remove(); document.documentElement.style.overflow = ''; };
  m.addEventListener('click', (e) => { if (e.target === m) close(); });
  m.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
  bind($('.dlg', m), close);
  $('input, textarea, button', m)?.focus();

function editMedia(id, done) {
  const list = gallery(); const i = list.findIndex((g) => g.id === id); const g = list[i]; if (!g) return;
  const isV = !!g.video; const cats = D.defs.galleryCategories;
  const close = modal(`<h3>${esc(pick(g.caption) || t.mNoCap)}</h3>
    <div class="pv">${isV ? `<video src="${esc(g.video)}" poster="${esc(g.image)}" controls playsinline preload="metadata"></video>` : `<img src="${esc(g.image)}" alt="">`}</div>
    <div class="prog" hidden><i></i></div>
    ${l3Fields('cap', t.mCap, g.caption)}
    ${isV ? '' : l3Fields('sub', t.mSub, g.sub, true, false)}
    <label class="f">${t.mCat}<select id="cat">${cats.map((c) => `<option value="${esc(c)}" ${c === g.category ? 'selected' : ''}>${esc(catN('g', c))}</option>`).join('')}</select></label>
    <div class="row"><button class="btn sm" data-a="replace">${isV ? t.mReplaceV : t.mReplace}</button>${isV ? `<button class="btn sm" data-a="poster">${t.mPoster}</button>` : ''}<button class="btn sm" data-a="up">↑ ${t.up}</button><button class="btn sm" data-a="down">↓ ${t.down}</button><button class="btn sm" data-a="hide">${g.hidden ? t.show : t.hide}</button><span class="sp"></span><button class="btn sm danger" data-a="del">${t.del}</button></div>
    <div class="row end"><button class="btn" data-a="close">${t.cancel}</button><button class="btn primary" data-a="save">${t.save}</button></div>`, (dlg, close) => {
    const prog = $('.prog', dlg);
    const commit = async () => {
      g.caption = readL3(dlg, 'cap'); if (!isV) { const s = readL3(dlg, 'sub'); if (s.kk || s.ru || s.en) g.sub = s; else delete g.sub; }
      g.category = $('#cat', dlg).value;
      if (await saveCms('gallery', list)) { close(); done(); }
    };
    $$('[data-a]', dlg).forEach((b) => b.onclick = async () => {
      const a = b.dataset.a;
      if (a === 'close') return close();
      if (a === 'save') return commit();
      if (a === 'up' || a === 'down') { const j = a === 'up' ? i - 1 : i + 1; if (j < 0 || j >= list.length) return; [list[i], list[j]] = [list[j], list[i]]; return commit(); }
      if (a === 'hide') { g.hidden = !g.hidden; if (!g.hidden) delete g.hidden; return commit(); }
      if (a === 'del') { if (!confirm(isV ? t.mConfirmV : t.mConfirm)) return; list.splice(i, 1); if (await saveCms('gallery', list)) { close(); done(); } return; }
      try {
        b.disabled = true; prog.hidden = false;
        if (a === 'replace' && !isV) { const [f] = await pickFiles('image/*'); if (!f) return; const [big] = await uploadImage(f, [2000], (p) => { $('i', prog).style.width = `${p * 100}%`; }); g.image = big.url; $('.pv', dlg).innerHTML = `<img src="${esc(g.image)}" alt="">`; }
        if (a === 'replace' && isV) { const [f] = await pickFiles('video/*'); if (!f) return; const r = await uploadVideo(f, (p) => { $('i', prog).style.width = `${p * 100}%`; }); g.video = r.src; if (r.poster) g.image = r.poster; $('.pv', dlg).innerHTML = `<video src="${esc(g.video)}" poster="${esc(g.image)}" controls playsinline></video>`; }
        if (a === 'poster') { const [f] = await pickFiles('image/*'); if (!f) return; const [p] = await uploadImage(f, [1280]); g.image = p.url; $('video', dlg).poster = g.image; }
      } catch (e) { alert(e.message || t.err); } finally { b.disabled = false; prog.hidden = true; }
    });
  });
}

    <div class="media"><button class="add" id="addc">${t.cAdd}</button>${shown.map((c) => `<button class="mi ${c.hidden ? 'dim' : ''}" data-id="${esc(c.id)}"><div class="ph" style="background-image:url('${esc(c.thumb)}');background-size:contain;background-color:#fff"></div>${c.hidden ? `<span class="badge tag warn">${t.mHiddenB}</span>` : ''}<div class="cap"><b>${esc(pick(c.title))}</b><span class="muted">${esc(c.note || '')}${c.year ? ` · ${c.year}` : ''}</span></div></button>`).join('')}</div>
    ${D.cms.certificates ? `<div class="bar"><span class="sp"></span><button class="btn sm" id="resetc">${t.mReset}</button></div>` : ''}`;
  $$('[data-c]', el).forEach((b) => b.onclick = () => { cCat = b.dataset.c; V.certs(el); });
  $$('.mi', el).forEach((b) => b.onclick = () => editCert(b.dataset.id, () => V.certs(el)));
  $('#addc', el).onclick = async (e) => {
    const [f] = await pickFiles('image/*'); if (!f) return;
    const b = e.currentTarget; b.disabled = true; b.textContent = t.mUploading;
    try {
      const [big, sm] = await uploadImage(f, [2400, 640]);
      const list = certs(); const id = `u-${Date.now().toString(36)}`;
      list.unshift({ id, image: big.url, thumb: sm.url, title: { kk: '', ru: '', en: '' }, year: new Date().getFullYear(), category: cCat === 'all' ? cats[0] : cCat, note: '', landscape: big.w > big.h });
      if (await saveCms('certificates', list)) { V.certs(el); editCert(id, () => V.certs(el)); }
    } catch (err) { alert(err.message || t.err); V.certs(el); }
  };
  $('#resetc', el)?.addEventListener('click', async () => { if (confirm(t.mResetQ) && await saveCms('certificates', null)) V.certs(el); });
};
function editCert(id, done) {
  const list = certs(); const i = list.findIndex((c) => c.id === id); const c = list[i]; if (!c) return;
  modal(`<h3>${esc(pick(c.title) || t.mNoCap)}</h3>
    <div class="pv" style="background:#fff"><img src="${esc(c.thumb)}" alt=""></div>
    ${l3Fields('title', t.cTitle, c.title, true)}
    <div class="grid2"><label class="f">${t.mCat}<select id="cat">${D.defs.certCategories.map((x) => `<option value="${esc(x)}" ${x === c.category ? 'selected' : ''}>${esc(catN('c', x))}</option>`).join('')}</select></label>
    <label class="f">${t.cNote}<input id="note" value="${esc(c.note || '')}"></label>
    <label class="f">${t.cYear}<input id="year" type="number" min="1990" max="2100" value="${c.year ?? ''}"></label></div>
    <div class="row"><button class="btn sm" data-a="replace">${t.mReplace}</button><button class="btn sm" data-a="up">↑ ${t.up}</button><button class="btn sm" data-a="down">↓ ${t.down}</button><button class="btn sm" data-a="hide">${c.hidden ? t.show : t.hide}</button><span class="sp"></span><button class="btn sm danger" data-a="del">${t.del}</button></div>
    <div class="row end"><button class="btn" data-a="close">${t.cancel}</button><button class="btn primary" data-a="save">${t.save}</button></div>`, (dlg, close) => {
    const commit = async () => { if (await saveCms('certificates', list)) { close(); done(); } };
    const read = () => { c.title = readL3(dlg, 'title'); c.category = $('#cat', dlg).value; c.note = $('#note', dlg).value.trim(); const y = parseInt($('#year', dlg).value, 10); c.year = Number.isInteger(y) ? y : null; };
    $$('[data-a]', dlg).forEach((b) => b.onclick = async () => {
      const a = b.dataset.a;
      if (a === 'close') return close();
      read();
      if (a === 'save') return commit();
      if (a === 'up' || a === 'down') { const j = a === 'up' ? i - 1 : i + 1; if (j < 0 || j >= list.length) return; [list[i], list[j]] = [list[j], list[i]]; return commit(); }
      if (a === 'hide') { c.hidden = !c.hidden; if (!c.hidden) delete c.hidden; return commit(); }
      if (a === 'del') { if (!confirm(t.cConfirm)) return; list.splice(i, 1); return commit(); }
      if (a === 'replace') { const [f] = await pickFiles('image/*'); if (!f) return; b.disabled = true; try { const [big, sm] = await uploadImage(f, [2400, 640]); c.image = big.url; c.thumb = sm.url; c.landscape = big.w > big.h; $('.pv img', dlg).src = c.thumb; } catch (e) { alert(e.message || t.err); } b.disabled = false; }
    });
  });
}

// ---------- Бағалар ----------
let q = '';
V.prices = (el, msg = '') => {
  const cat = D.catalog, content = D.content;
  const pv = (r) => content.prices[r.id] || r;
  const vv = (p, v) => content.products[`${p.slug}|${v.size}`] || v;
  const prod = cat.products.filter((p) => !q || (pick(p.name) + ' ' + p.name.ru + ' ' + p.variants.map((v) => v.art).join(' ')).toLowerCase().includes(q.toLowerCase()));
  el.innerHTML = `<p class="muted">${t.pHint}</p>
    <h2 class="sec">${t.pList}</h2>
    ${cat.prices.map((g) => `<h3 style="color:var(--green);font-size:1rem;margin:16px 0 6px">${esc(pick(g.title))}</h3><div class="rows">${g.rows.map((r) => { const c = pv(r); return `<div class="pr ${c.hidden ? 'off' : ''}" data-pr="${esc(r.id)}">
      <div>${esc(pick(r.name))}</div>
      <div class="ctl"><input type="number" min="0" step="500" inputmode="numeric" data-k="min" value="${c.min}" aria-label="${t.pMin}"> – <input type="number" min="0" step="500" inputmode="numeric" data-k="max" value="${c.max}" aria-label="${t.pMax}">
      <label class="chk"><input type="checkbox" data-k="hidden" ${c.hidden ? 'checked' : ''}>${t.hide}</label></div></div>`; }).join('')}</div>`).join('')}
    <h2 class="sec">${t.pShop}</h2>
    <input id="q" type="search" placeholder="${t.search}" value="${esc(q)}" style="max-width:420px;margin-bottom:12px">
    <div class="rows">${prod.map((p) => p.variants.map((v) => { const c = vv(p, v); return `<div class="pr" data-pp="${esc(p.slug)}|${esc(v.size)}">
      <div>${esc(pick(p.name))}<small>${esc(v.size)} · арт. ${esc(v.art)}</small></div>
      <div class="ctl"><input type="number" min="0" step="100" inputmode="numeric" data-k="price" value="${c.price ?? ''}" placeholder="${t.pPrice}" aria-label="${t.pPrice}">
      <select data-k="stock" aria-label="${t.pStock}"><option value="">${t.pStock}: ${t.pU}</option><option value="1" ${c.inStock === true ? 'selected' : ''}>${t.pY}</option><option value="0" ${c.inStock === false ? 'selected' : ''}>${t.pN}</option></select></div></div>`; }).join('')).join('')}</div>
    <div class="bar"><button class="btn primary" id="save">${t.save}</button><span id="msg" class="${msg ? '' : 'muted'}" style="${msg ? 'color:var(--green);font-weight:600' : ''}">${esc(msg)}</span></div>`;
  const mark = () => { dirty = true; const m = $('#msg', el); m.className = 'err'; m.style.cssText = ''; m.textContent = t.unsaved; };
  $$('.pr input, .pr select', el).forEach((i) => { i.oninput = mark; i.onchange = () => { mark(); if (i.dataset.k === 'hidden') i.closest('.pr').classList.toggle('off', i.checked); }; });
  $('#q', el).oninput = (e) => { const c = collectPrices(el); if (!c) return; D.content = c; q = e.target.value; const wasDirty = dirty; V.prices(el); const i = $('#q', el); i.focus(); i.setSelectionRange(q.length, q.length); if (wasDirty) mark(); };
  $('#save', el).onclick = async () => {
    const c = collectPrices(el); if (!c) return;
    try { D.content = await jput('/api/admin/content', c); dirty = false; V.prices(el, t.pSaved); } catch (e) { if (e.message !== 'login') alert(t.err); }
  };
};
function collectPrices(el) {
  const out = { prices: { ...D.content.prices }, products: { ...D.content.products } };
  const int = (i) => i.value.trim() === '' ? null : /^\d+$/.test(i.value.trim()) ? Number(i.value) : NaN;
  const rows = Object.fromEntries(D.catalog.prices.flatMap((g) => g.rows.map((r) => [r.id, r])));
  for (const r0 of $$('[data-pr]', el)) {
    const r = rows[r0.dataset.pr]; const min = int($('[data-k=min]', r0)), max = int($('[data-k=max]', r0)); const hidden = $('[data-k=hidden]', r0).checked;
    if (Number.isNaN(min) || Number.isNaN(max) || min === null || max === null) { alert(t.pBad); $('input', r0).focus(); return null; }
    const lo = Math.min(min, max), hi = Math.max(min, max);
    if (lo === r.min && hi === r.max && !hidden) delete out.prices[r.id]; else out.prices[r.id] = { min: lo, max: hi, ...(hidden ? { hidden: true } : {}) };
  }
  const vars = Object.fromEntries(D.catalog.products.flatMap((p) => p.variants.map((v) => [`${p.slug}|${v.size}`, v])));
  for (const r0 of $$('[data-pp]', el)) {
    const v = vars[r0.dataset.pp]; const price = int($('[data-k=price]', r0));
    if (Number.isNaN(price)) { alert(t.pBad); $('input', r0).focus(); return null; }
    const st = $('[data-k=stock]', r0).value; const inStock = st === '' ? null : st === '1'; const p = price || null;
    if (p === v.price && inStock === v.inStock) delete out.products[r0.dataset.pp]; else out.products[r0.dataset.pp] = { price: p, inStock };
  }
  return out;
}

// ---------- Байланыс ----------
V.contacts = (el) => {
  const d = D.defs.contacts; const c = { ...clone(d), ...clone(D.cms.contacts || {}) };
  const phoneRow = (p = { number: '', display: '' }) => `<div class="row ph-row"><input data-p="display" placeholder="8 700 000 00 00" value="${esc(p.display)}" style="flex:1;min-width:180px"><button class="btn sm danger" data-rm type="button">✕</button></div>`;
  const hourRow = (h = { days: {}, time: '' }) => `<div class="card h-row" style="display:grid;gap:8px;padding:12px">${l3Fields('days', t.kDays, h.days, false, false)}<div class="row"><label class="f" style="flex:1">${t.kTime}<input data-h="time" value="${esc(h.time)}" placeholder="10:00 – 18:00"></label><button class="btn sm danger" data-rm type="button" style="align-self:end">✕</button></div></div>`;
  el.innerHTML = `<form id="cf" class="list" novalidate>
    <div class="card list"><h2 class="sec">${t.kPhones}</h2><div id="phones" class="list">${(c.phones || []).map(phoneRow).join('')}</div><div><button class="btn sm" type="button" id="addph">${t.kAddPhone}</button></div></div>
    <div class="card list"><h2 class="sec">WhatsApp</h2>
      <label class="f">${t.kWa}<input name="whatsapp" inputmode="numeric" placeholder="77001234567" value="${esc(c.whatsapp || '')}"><span class="small muted" style="font-weight:400">${t.kWaHint}</span></label>
      <label class="f">${t.kWaLink}<input name="whatsappLink" placeholder="https://wa.me/..." value="${esc(c.whatsappLink || '')}"></label>
      <div class="grid2"><label class="f">${t.kOrders}<input name="ordersWhatsapp" inputmode="numeric" value="${esc(c.ordersWhatsapp || '')}"></label><label class="f">${t.kFeedback}<input name="feedbackWhatsapp" inputmode="numeric" value="${esc(c.feedbackWhatsapp || '')}"></label></div>
    </div>
    <div class="card list"><h2 class="sec">${t.kSocial}</h2>
      <div class="grid2"><label class="f">Instagram<input name="instagram" placeholder="https://www.instagram.com/..." value="${esc(c.instagram || '')}"></label><label class="f">TikTok<input name="tiktok" placeholder="https://www.tiktok.com/@..." value="${esc(c.tiktok || '')}"></label>
      <label class="f">YouTube<input name="youtube" placeholder="https://www.youtube.com/@..." value="${esc(c.youtube || '')}"></label><label class="f">${t.kBooking}<input name="bookingUrl" value="${esc(c.bookingUrl || '')}"></label>
      <label class="f">${t.k2gis}<input name="twoGisUrl" value="${esc(c.twoGisUrl || '')}"></label></div>
    </div>
    <div class="card list"><h2 class="sec">${t.kAddr}</h2>${l3Fields('address', t.kAddr, c.address, false, false)}${l3Fields('addressNote', t.kAddrNote, c.addressNote, false, false)}</div>
    <div class="card list"><h2 class="sec">${t.kHours}</h2><div id="hours" class="list">${(c.hours || []).map(hourRow).join('')}</div><div><button class="btn sm" type="button" id="addh">${t.kAddHours}</button></div></div>
    <div class="bar"><button class="btn primary" type="submit">${t.save}</button>${D.cms.contacts ? `<span class="sp"></span><button class="btn sm" type="button" id="resetk">${t.mReset}</button>` : ''}</div>
  </form>`;
  const f = $('#cf', el);
  f.addEventListener('input', () => { dirty = true; });
  f.addEventListener('click', (e) => { if (e.target.closest('[data-rm]')) { e.target.closest('.ph-row, .h-row').remove(); dirty = true; } });
  $('#addph', el).onclick = () => $('#phones', el).insertAdjacentHTML('beforeend', phoneRow());
  $('#addh', el).onclick = () => $('#hours', el).insertAdjacentHTML('beforeend', hourRow());
  $('#resetk', el)?.addEventListener('click', async () => { if (confirm(t.mResetQ) && await saveCms('contacts', null)) { dirty = false; V.contacts(el); } });
  f.onsubmit = async (e) => {
    e.preventDefault();
    const val = (n) => f.elements[n].value.trim();
    const urls = ['whatsappLink', 'instagram', 'tiktok', 'youtube', 'bookingUrl', 'twoGisUrl'];
    for (const u of urls) if (val(u) && !/^https?:\/\//.test(val(u))) { alert(t.kBadUrl); f.elements[u].focus(); return; }
    const digits = (v) => v.replace(/\D/g, '').replace(/^8(?=\d{10}$)/, '7');
    const out = {
      phones: $$('.ph-row', el).map((r) => { const d0 = $('[data-p=display]', r).value.trim(); return { number: digits(d0), display: d0 }; }).filter((p) => p.number.length >= 10),
      whatsapp: digits(val('whatsapp')) || null, ordersWhatsapp: digits(val('ordersWhatsapp')) || d.ordersWhatsapp, feedbackWhatsapp: digits(val('feedbackWhatsapp')) || d.feedbackWhatsapp,
      address: readL3(f, 'address'), addressNote: readL3(f, 'addressNote'),
      hours: $$('.h-row', el).map((r) => ({ days: readL3(r, 'days'), time: $('[data-h=time]', r).value.trim() })).filter((h) => h.time || h.days.kk || h.days.ru),
    };
    for (const u of urls) out[u] = val(u) || null;
    if (await saveCms('contacts', out)) { dirty = false; V.contacts(el); }
  };
};

// ---------- Беттердегі мәтіндер ----------
const KEYN = new Proxy({}, { get: (_, k) => ({ title: lang === 'kk' ? 'Беттің атауы (браузер қойындысы, Google)' : 'Название страницы (вкладка, Google)', desc: lang === 'kk' ? 'Google мен Яндекстегі қысқа сипаттама' : 'Краткое описание в Google и Яндексе', h1: lang === 'kk' ? 'Басты тақырып' : 'Главный заголовок', lead: lang === 'kk' ? 'Тақырып астындағы мәтін' : 'Текст под заголовком' })[k] });
let tPage = 'index', tq = '';
V.texts = (el) => {
  const cat = D.texts; const pages = Object.keys(cat);
  if (!pages.length) { el.innerHTML = `<div class="empty">${t.tNone}</div>`; return; }
  if (!cat[tPage]) tPage = pages.includes('index') ? 'index' : pages[0];
  const ov = clone(D.cms.texts || {}); const mine = ov[tPage] || {};
  const order = Object.keys(t.pages);
  const sorted = pages.sort((a, b) => (order.indexOf(a) + 1 || 99) - (order.indexOf(b) + 1 || 99));
  const rows = Object.entries(cat[tPage]).filter(([k, v]) => !tq || [k, v.kk, v.ru, v.en, mine[k]?.kk, mine[k]?.ru].join(' ').toLowerCase().includes(tq.toLowerCase()));
  el.innerHTML = `<div class="row" style="margin-bottom:12px"><label class="f" style="flex:1;min-width:220px">${t.tPage}<select id="pg">${sorted.map((p) => `<option value="${p}" ${p === tPage ? 'selected' : ''}>${esc(t.pages[p] || p)}${ov[p] ? ' •' : ''}</option>`).join('')}</select></label><label class="f" style="flex:1;min-width:200px">${t.search}<input id="tq" type="search" value="${esc(tq)}"></label></div>
    <p class="muted small">${t.tHint}</p>
    <div class="list">${rows.map(([k, d]) => { const cur = { ...d, ...(mine[k] || {}) }; const ch = !!mine[k]; const long = Math.max(...['kk', 'ru', 'en'].map((l) => (cur[l] || '').length)) > 70; return `<div class="tx ${ch ? 'ch' : ''}" data-k="${esc(k)}"><div class="k"><span>${esc(KEYN[k] || k)}</span>${ch ? `<span class="tag">${t.tChanged}</span><button class="btn sm ghost" data-reset title="${t.tReset}">↺</button>` : ''}</div>
      <div class="grid3">${['kk', 'ru', 'en'].map((l) => `<label class="f"><span class="lg">${l === 'kk' ? 'ҚАЗ' : l === 'ru' ? 'РУС' : 'ENG'}</span><textarea data-l="${l}" rows="${long ? 3 : 1}">${esc(cur[l] || '')}</textarea></label>`).join('')}</div></div>`; }).join('')}</div>
    <div class="bar"><button class="btn primary" id="save">${t.save}</button><span id="msg" class="muted"></span></div>`;
  const collect = () => {
    const page = { ...(mine) };
    for (const box of $$('.tx', el)) {
      const k = box.dataset.k; const d = cat[tPage][k]; const v = {};
      for (const ta of $$('textarea', box)) { const l = ta.dataset.l; if (ta.value !== (d[l] || '')) v[l] = ta.value; }
      if (Object.keys(v).length) page[k] = v; else delete page[k];
    }
    return page;
  };
  const store = () => { const p = collect(); if (Object.keys(p).length) ov[tPage] = p; else delete ov[tPage]; return ov; };
  el.addEventListener('input', (e) => { if (e.target.tagName === 'TEXTAREA') { dirty = true; const m = $('#msg', el); m.className = 'err'; m.textContent = t.unsaved; } }, { once: false });
  $('#pg', el).onchange = (e) => { if (dirty && !confirm(t.leave)) { e.target.value = tPage; return; } dirty = false; tPage = e.target.value; tq = ''; V.texts(el); };
  $('#tq', el).onchange = (e) => { if (dirty) D.cms.texts = store(); tq = e.target.value; V.texts(el); };
  $$('[data-reset]', el).forEach((b) => b.onclick = () => { const box = b.closest('.tx'); const d = cat[tPage][box.dataset.k]; $$('textarea', box).forEach((ta) => { ta.value = d[ta.dataset.l] || ''; }); dirty = true; box.classList.remove('ch'); });
  $('#save', el).onclick = async () => { const all = store(); if (await saveCms('texts', all)) { dirty = false; V.texts(el); } };
};

// ---------- Баптаулар ----------
V.settings = (el) => {
  const open = D.cms.seo?.open !== false; const b = D.build || {};
  el.innerHTML = `<div class="list">
    <div class="card"><label class="chk" style="font-size:1rem;color:var(--text);font-weight:600"><input type="checkbox" id="seo" ${open ? 'checked' : ''}> ${t.stSeo}</label><p class="muted small" style="margin:6px 0 0">${t.stSeoHint}</p></div>
    <div class="card"><div class="row"><span>${t.stInfo}: <b>${b.finishedAt ? fmtD(b.finishedAt) : '–'}</b>${b.ms ? ` <span class="muted small">(${Math.round(b.ms / 1000)} с)</span>` : ''}</span><span class="sp"></span><button class="btn sm" id="rb" ${D.canBuild ? '' : 'disabled'}>${t.stRebuild}</button></div>${b.state === 'error' ? `<pre class="small" style="white-space:pre-wrap;color:var(--red)">${esc(b.error)}</pre>` : ''}</div>
  </div>`;
  $('#seo', el).onchange = async (e) => { if (!await saveCms('seo', { open: e.target.checked })) e.target.checked = !e.target.checked; };
  $('#rb', el).onclick = async () => { await saveCms('seo', { open: D.cms.seo?.open !== false }); V.settings(el); };
};

// ---------- Іске қосу ----------
addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
async function start() {
  try { await loadAll(); } catch (e) { if (e.message !== 'login') showLogin(t.err); return; }
  shell(); pollBuild(500);
  // Жаңа пікір, ұсыныс, тапсырыс бар-жоғын әр минут сайын тексереміз
  setInterval(async () => {
    if (!$('.app')) return;
    try {
      const [r, s, o] = await Promise.all([api('/api/admin/reviews'), api('/api/admin/suggestions'), api('/api/admin/orders')]);
      D.reviews = (await r.json()).reviews; D.sugs = (await s.json()).suggestions; D.orders = (await o.json()).orders;
      refreshNav();
      if (!dirty && !$('.modal') && ['home', 'reviews', 'sugs', 'orders'].includes(view) && !$('.rbox:not([hidden])')) render();
    } catch {}
  }, 60000);
}
start();
</script>
